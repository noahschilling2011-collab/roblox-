function addLog(text,art='info'){state.log.push({alter:state.alter,text,art});}
function lernFaktor(quelle){const teiler=quelle==='ereignis'?GEIST.teilerPassiv:GEIST.teilerAktiv;return Math.max(0,1-state.stats.intelligenz/teiler);}
function apply(w={},quelle='aktiv'){for(const k of Object.keys(STATS))if(w[k])state.stats[k]=clamp(state.stats[k]+(k==='intelligenz'&&w[k]>0?w[k]*lernFaktor(quelle):w[k]));if(w.geld)state.geld=clamp(state.geld+w.geld,-1e12,1e12);if(w.ruf&&state.kanal)state.kanal.ruf=clamp(state.kanal.ruf+w.ruf);if(w.beziehung)state.beziehungen.forEach(b=>b.verhaeltnis=clamp(b.verhaeltnis+w.beziehung));if(w.freund)addFriend();if(w.follower&&state.kanal){const p=Object.values(state.kanal.plattformen).find(p=>p.aktiv);if(p)p.follower+=w.follower;}if(w.flags)Object.assign(state.flags,w.flags);}
function addFriend(){if(state.beziehungen.filter(b=>b.typ==='Freundschaft').length>=10)return;const name=pick(FIRST)+' '+pick(LAST);state.beziehungen.push({id:'kontakt_'+state.alter+'_'+rnd(1,1e8),name,typ:'Freundschaft',verhaeltnis:rnd(45,75)});addLog(`${name} wird Teil deines Lebens.`,'gut');}
function available(){return state.lebendig&&!state.flags.pend.length;}
function gesperrt(){return state.jahr<(state.flags.insolvenzBis||0);}
function kaufbar(cost=0){return cost<=0||state.geld-cost>=(gesperrt()?0:GELD.dispo);}
function zeitMax(s=state){const basis=s.alter<6?ZEIT.kind:s.alter<13?ZEIT.schulkind:s.alter<18?ZEIT.jugend:ZEIT.erwachsen;const abzug=(s.job?ZEIT.jobAbzug:0)+(['studium','ausbildung'].includes(s.bildung)?ZEIT.ausbildungAbzug:0);return Math.max(ZEIT.min,basis-abzug);}
function zeitStand(){state.zeit.max=zeitMax();return state.zeit;}
function zeitFrei(k=1){const z=zeitStand();return z.genutzt+k<=z.max;}
function canAct(min=0,cost=0,zeit=1){return available()&&state.alter>=min&&kaufbar(cost)&&zeitFrei(zeit);}
function consume(k=1){state.zeit.genutzt+=k;}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),3200);}

function eligible(e){return state.alter>=(e.minAlter??0)&&state.alter<=(e.maxAlter??120)&&(!e.bedingung||e.bedingung(state))&&(e.wiederholbar||!state.flags.gesehen.includes(e.id));}
const eventWeight=e=>typeof e.gewicht==='function'?e.gewicht(state):e.gewicht;
function drawEvents(){const used=new Set();for(let i=0,n=rnd(2,4);i<n;i++){const pool=EREIGNISSE.filter(e=>eligible(e)&&eventWeight(e)>0&&!used.has(e.id));if(!pool.length)break;let r=Math.random()*pool.reduce((t,e)=>t+eventWeight(e),0);const e=pool.find(e=>(r-=eventWeight(e))<=0)||pool[0];used.add(e.id);if(!state.flags.gesehen.includes(e.id))state.flags.gesehen.push(e.id);if(e.optionen)state.flags.pend.push(e.id);else{apply(e.wirkung,'ereignis');if(e.effekt)e.effekt(state);addLog(typeof e.text==='function'?e.text(state):e.text,e.art);}}}

function calculatePost(platform,kind,budget){const c=state.kanal,p=c.plattformen[platform],d=PLATFORMS[platform],skill=nischenSkill();const quality=.3+skill/180+hobbyLevel('schnitt')/400+state.stats.intelligenz/300+state.stats.aussehen/(platform==='instagram'?170:500)+c.ruf/200;let viralChance=(kind==='sicher'?0:kind==='trend'?.09:.16)+skill/900+c.ruf/1700+Math.min(.035,c.postsGesamt*.002);if(kind==='sicher')viralChance=0;viralChance*=d.viral/(1+c.postsDiesesJahr*SAETTIGUNG.viral);if(adShare()>.4)viralChance*=.35;const roll=Math.random();let result=kind==='sicher'?'solide':roll<viralChance?'viral':roll<(kind==='experiment'?.46:.25)?'flop':roll>.75?'stark':'solide';const base=(220+(p.follower-p.gekauft)*.06)*quality*d.growth;let organic=result==='flop'?Math.max(4,Math.round(base*.025)):result==='viral'?Math.round((WACHSTUM.viralSockel+Math.sqrt(p.follower)*150+Math.pow(p.follower,WACHSTUM.viralExponent)*WACHSTUM.viralFaktor)*quality*d.growth):result==='stark'?Math.round(base*5):Math.round(base);organic=Math.round(organic/(1+c.postsDiesesJahr*SAETTIGUNG.reichweite));organic=Math.min(organic,Math.max(WACHSTUM.deckelSockel,Math.round(p.follower*WACHSTUM.deckelAnteil)));if(state.flags.drosselBis>=state.jahr)organic=Math.round(organic*.5);const multiplier=1+Math.min(1.5,Math.sqrt(budget/d.adCost));const gain=Math.round(organic*multiplier);const bought=budget>0?Math.round(gain*RESULTS[result][1]):0;return{result,organic,gain,bought,multiplier,views:Math.round(organic*(result==='viral'?35:18)),quality};}
function uploadVideo(platform,kind,budget){if(budget>0&&gesperrt())return false;if(!postingAllowed()||!PLATFORMS[platform]||!state.kanal.plattformen[platform].aktiv||!['sicher','trend','experiment'].includes(kind)||!BUDGETS.includes(budget)||budget>0&&state.geld<budget)return false;const c=state.kanal,p=c.plattformen[platform],r=calculatePost(platform,kind,budget);consume(ZEIT.upload);state.geld-=budget;c.werbungGesamt+=budget;p.follower+=r.gain;p.gekauft+=r.bought;p.lastPost=state.jahr;c.postsDiesesJahr++;c.postsGesamt++;c.letztesPostJahr=state.jahr;apply({ruf:r.result==='flop'?-4:r.result==='viral'?7:3,glueck:r.result==='flop'?-5:r.result==='viral'?12:4});addLog(`${PLATFORMS[platform].name} · ${RESULTS[r.result][0]}: ${num(r.views)} organische Aufrufe, +${num(r.gain)} Follower.${budget?' '+eur(budget)+' Werbung verstärkt um ×'+r.multiplier.toFixed(2).replace('.',',')+'.':''}`,r.result==='flop'?'schlecht':r.result==='viral'?'gross':'gut');if(r.result==='viral'){for(const [key,other]of Object.entries(c.plattformen))if(key!==platform&&other.aktiv){const cross=Math.round(r.organic*.1);other.follower+=cross;addLog(`Der Treffer bringt auch ${PLATFORMS[key].name} ${num(cross)} echte Follower.`,'gut');}state.flags.folge.push({jahr:state.jahr+1,text:'Dein virales Video taucht noch einmal auf. Eine neue Gruppe findet deinen Kanal.',wirkung:{follower:Math.round(r.organic*.07),glueck:3},art:'gut'});}c.history.unshift({jahr:state.jahr,platform,kind,result:r.result,gain:r.gain,views:r.views,budget});c.history=c.history.slice(0,12);state.records.kanal=Math.max(state.records.kanal,totalFollowers());return r;}
function loseFollowers(fraction){if(!state.kanal)return;for(const p of Object.values(state.kanal.plattformen)){p.follower=Math.round(p.follower*(1-fraction));p.gekauft=Math.min(p.follower,Math.round(p.gekauft*(1-fraction)));}}

else if(a==='hobby'){const h=HOBBYS.find(x=>x.id===id);if(!h||!canAct(6,0,ZEIT.hobby))return;consume(ZEIT.hobby);let own=state.hobbys.find(x=>x.id===id);if(!own){own={id,name:h.name,jahre:0,niveau:0,meilensteine:[],trainYear:state.jahr};state.hobbys.push(own);addLog(`Du fängst mit ${h.name} an. Aller Anfang ist ziemlich wacklig.`,'gross');}else{own.trainYear=state.jahr;addLog(`Du nimmst dir dieses Jahr bewusst Zeit für ${h.name}.`);}render();}

function postExclusive(title,promo,budget){if(!ofPostingAllowed()||!['none','tiktok','instagram','both'].includes(promo)||!BUDGETS.includes(budget)||budget>0&&(state.geld<budget||gesperrt()))return false;const channels=promo==='none'?[]:promo==='both'?['tiktok','instagram']:[promo];if(channels.some(k=>!state.kanal?.plattformen[k]?.aktiv)||!channels.length&&budget>0)return false;const f=state.onlyfans;let audience=0;for(const k of channels){const p=state.kanal.plattformen[k];audience+=(p.follower-p.gekauft+p.gekauft*.25)*(k==='instagram'?1.2:1);p.lastPost=state.jahr;}
const outcome=Math.random(),quality=.5+f.zufriedenheit/200+state.stats.intelligenz/300+Math.max(...state.hobbys.map(h=>h.niveau),0)/250;const organic=Math.max(1,Math.round((6+audience*.003)*quality*(9/f.preis)*(outcome<.12?.2:outcome>.85?2.1:1)));const multi=1+Math.min(1.5,Math.sqrt(budget/4400));const abos=Math.round(organic*multi);consume(ZEIT.upload);state.geld-=budget;f.werbungGesamt+=budget;f.abos+=abos;f.zufriedenheit=clamp(f.zufriedenheit+(outcome<.12?-5:9));f.postsGesamt++;f.postsDiesesJahr++;f.lastPost=state.jahr;const promoName=promo==='none'?'Ohne Werbung':promo==='both'?'TikTok & Instagram':PLATFORMS[promo].name;f.history.unshift({title,jahr:state.jahr,promo:promoName,abos,budget});f.history=f.history.slice(0,12);apply({glueck:outcome<.12?-2:5});addLog(`OnlyFans · „${title}“: +${num(abos)} Abos.${channels.length?' Dein Vorschauclip auf '+promoName+' macht auf das Video aufmerksam.':''}${budget?' Werbebudget: '+eur(budget)+'.':''}`,'gut');if(f.belastung+f.postsDiesesJahr>=CREATOR.burnout){f.pauseBis=state.jahr+2;f.belastung=0;apply({gesundheit:-14,glueck:-14});addLog('Nur noch exklusive Inhalte im Kopf. Du brauchst im nächsten Jahr eine Upload-Pause.','schlecht');}return{abos,organic};}
function handleAction(el){const a=el.dataset.action,id=el.dataset.id;if(a==='choice')return resolveChoice(Number(id));if(state.flags.pend.length)return;if(a==='view'){state.ui.view=id;render();}else if(a==='filter'){state.ui.filter=id;render();}else if(a==='year')nextYear();else if(a==='random-name')document.getElementById('new-name').value=pick(FIRST)+' '+pick(LAST);else if(a==='save'||a==='load')openDialog(a);else if(a==='new')openDialog('new');else if(a==='reset'){closeDialog(true);state=fresh();render();}else if(a==='close')closeDialog();else if(a==='copy')copySave();else if(a==='import')importSave();else extraAction(a,id,el);}

function normalizeSave(raw){
if(!raw||typeof raw!=='object'||Array.isArray(raw)||typeof raw.name!=='string'||!raw.name.trim()||!Number.isInteger(raw.alter)||raw.alter<0||raw.alter>110)throw Error('Das ist kein gültiger Lebenslinie-Spielstand. Name und Alter fehlen oder sind ungültig.');
if(raw.version!==undefined&&raw.version!==1)throw Error('Diese Spielstand-Version wird nicht unterstützt.');
const str=(v,d='',max=80)=>typeof v==='string'?v.slice(0,max):d;
const n=(v,d=0,min=0,max=1e12)=>clamp(typeof v==='number'&&Number.isFinite(v)?v:d,min,max);
const obj=v=>v&&typeof v==='object'&&!Array.isArray(v)?v:{};
const arr=v=>Array.isArray(v)?v:[];
const own=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
const s=fresh(raw.name.trim().slice(0,48),['m','w','d'].includes(raw.geschlecht)?raw.geschlecht:'d',str(raw.stadt,'Stuttgart',48));s.alter=raw.alter;s.jahr=2026+s.alter;s.geld=n(raw.geld,0,-1e12);s.lebendig=raw.lebendig!==false&&s.alter<110;
for(const k of Object.keys(STATS))s.stats[k]=n(obj(raw.stats)[k],s.stats[k],0,100);
if(s.stats.gesundheit===0)s.lebendig=false;
s.bildung=own(BILDUNG,raw.bildung)?raw.bildung:s.alter>=18?'mittlere_reife':s.alter>=6?'schule':'keine';
const rf=obj(raw.flags);const flagKeys=['aktion','botsAbgelehnt','vollzeit','entschuldigung','drosselBis','abschlussJahr','insolvenzBis','insolvenzen','geistJahr','grundJahr'];for(const k of flagKeys)if(typeof rf[k]==='boolean'||typeof rf[k]==='number'&&Number.isFinite(rf[k]))s.flags[k]=rf[k];
s.flags.aktion=rf.aktion===true;
