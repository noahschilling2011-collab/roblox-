function fresh(name='Alex Winter',gender='d',city='Stuttgart'){return {version:1,jahr:2026,alter:0,lebendig:true,name,geschlecht:gender,stadt:city,stats:{gesundheit:rnd(75,95),glueck:rnd(65,90),intelligenz:rnd(35,80),aussehen:rnd(40,85)},geld:0,job:null,bildung:'keine',hobbys:[],kanal:null,onlyfans:null,beziehungen:[{id:'mutter',name:'Mama',typ:'Familie',verhaeltnis:85},{id:'vater',name:'Papa',typ:'Familie',verhaeltnis:80},{id:'geschwister',name:pick(FIRST),typ:'Geschwister',verhaeltnis:70}],log:[],flags:{gesehen:[],folge:[],aktion:false,pend:[],endePruefen:false,rendered:0},records:{job:'Noch kein Beruf',gehalt:0,kanal:0,hobby:'Noch kein Hobby',niveau:0,einnahmen:0},finanzen:{gehalt:0,creator:0,abo:0,kosten:0,hobby:0},ui:{view:'leben',filter:'alle',started:false,modal:null}};}
let state=fresh();
function addLog(text,art='info'){state.log.push({alter:state.alter,text,art});}
function apply(w={}){for(const k of Object.keys(STATS))if(w[k])state.stats[k]=clamp(state.stats[k]+w[k]);if(w.geld)state.geld=clamp(state.geld+w.geld,-1e12,1e12);if(w.ruf&&state.kanal)state.kanal.ruf=clamp(state.kanal.ruf+w.ruf);if(w.beziehung)state.beziehungen.forEach(b=>b.verhaeltnis=clamp(b.verhaeltnis+w.beziehung));if(w.freund)addFriend();if(w.follower&&state.kanal){const p=Object.values(state.kanal.plattformen).find(p=>p.aktiv);if(p)p.follower+=w.follower;}if(w.flags)Object.assign(state.flags,w.flags);}
function addFriend(){if(state.beziehungen.filter(b=>b.typ==='Freundschaft').length>=10)return;const name=pick(FIRST)+' '+pick(LAST);state.beziehungen.push({id:'kontakt_'+state.alter+'_'+rnd(1,1e8),name,typ:'Freundschaft',verhaeltnis:rnd(45,75)});addLog(`${name} wird Teil deines Lebens.`,'gut');}
function available(){return state.lebendig&&!state.flags.aktion&&!state.flags.pend.length;}
function canAct(min=0,cost=0){return available()&&state.alter>=min&&(cost===0||state.geld>=cost);}
function consume(){state.flags.aktion=true;}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),3200);}

function eligible(e){return state.alter>=(e.minAlter??0)&&state.alter<=(e.maxAlter??120)&&(!e.bedingung||e.bedingung(state))&&(e.wiederholbar||!state.flags.gesehen.includes(e.id));}
const eventWeight=e=>typeof e.gewicht==='function'?e.gewicht(state):e.gewicht;
function drawEvents(){const used=new Set();for(let i=0,n=rnd(2,4);i<n;i++){const pool=EREIGNISSE.filter(e=>eligible(e)&&eventWeight(e)>0&&!used.has(e.id));if(!pool.length)break;let r=Math.random()*pool.reduce((t,e)=>t+eventWeight(e),0);const e=pool.find(e=>(r-=eventWeight(e))<=0)||pool[0];used.add(e.id);if(!state.flags.gesehen.includes(e.id))state.flags.gesehen.push(e.id);if(e.optionen)state.flags.pend.push(e.id);else{apply(e.wirkung);if(e.effekt)e.effekt(state);addLog(typeof e.text==='function'?e.text(state):e.text,e.art);}}}
function resolveChoice(i){const id=state.flags.pend[0],e=EREIGNISSE.find(e=>e.id===id),o=e?.optionen[i];if(!o||o.bedingung&&!o.bedingung(state))return;if(o.kosten&&state.geld<o.kosten)return;addLog(typeof e.text==='function'?e.text(state):e.text,e.art||'gross');apply(o.wirkung);if(o.effekt)o.effekt(state);addLog(o.ergebnis||`Du entscheidest dich: ${o.text}`,'info');if(o.folge)state.flags.folge.push({jahr:state.jahr+1,...o.folge});state.flags.pend.shift();closeDialog(true);render();processPending();}
function processPending(){if(state.flags.pend.length){const e=EREIGNISSE.find(e=>e.id===state.flags.pend[0]);if(!e){state.flags.pend.shift();return processPending();}openDialog('entscheidung',e);return;}if(state.flags.endePruefen){state.flags.endePruefen=false;deathCheck();render();}}
function nextYear(){if(!state.ui.started||!state.lebendig||state.flags.pend.length)return;state.alter++;state.jahr++;state.flags.aktion=false;state.flags.folge=state.flags.folge.filter(f=>{if(f.jahr>state.jahr)return true;apply(f.wirkung);addLog(f.text,f.art||'info');return false;});if(state.alter>=45)apply({gesundheit:-rnd(0,state.alter>70?4:2)});if(state.alter>=35)apply({aussehen:-rnd(0,2)});if(state.alter>80&&Math.random()<.25)apply({intelligenz:-1});annualLife();annualCreator();drawEvents();state.flags.endePruefen=true;render();processPending();}
function deathCheck(){if(state.stats.gesundheit<=0||state.alter>=110||(state.alter>=70&&Math.random()<(state.alter-69)*.0025)){state.lebendig=false;addLog(`Mit ${state.alter} Jahren endet dein Leben. Was bleibt, sind die Geschichten.`,'gross');state.ui.view='leben';}}

function annualLife(){
state.finanzen={gehalt:0,creator:0,abo:0,kosten:0,hobby:0};
if(state.alter===6){state.bildung='schule';addLog('Der erste Schultag. Dein Rucksack ist fast so groß wie du.','gross');}
if(state.alter===16){state.bildung='mittlere_reife';queueSpecial('bildung_16');}
if(state.alter===18&&state.bildung==='oberstufe'){state.bildung='abitur';addLog('Du hast dein Abitur in der Tasche.','gross');queueSpecial('bildung_18');}
if(state.flags.abschlussJahr===state.jahr){if(state.bildung==='ausbildung'){state.bildung='berufsabschluss';addLog('Ausbildung abgeschlossen. Zum ersten Mal steht „Fachkraft“ auf deinem Zeugnis.','gross');}else if(state.bildung==='studium'){state.bildung='abschluss';apply({intelligenz:8});addLog('Dein Studium ist abgeschlossen. Auf einmal hast du einen Titel, aber keinen Stundenplan.','gross');}}
if(['schule','oberstufe','studium','ausbildung'].includes(state.bildung))apply({intelligenz:rnd(0,2)});
if(state.alter>=6&&state.alter<18){const tasche=state.alter*40;state.geld+=tasche;state.finanzen.gehalt+=tasche;}
if(state.bildung==='ausbildung'){state.geld+=12000;state.finanzen.gehalt+=12000;}
if(state.job){state.job.jahreImJob++;let salary=state.job.gehalt;if(state.alter>=67)salary=Math.round(salary*.5);state.geld+=salary;state.finanzen.gehalt+=salary;if(state.alter<67){if(Math.random()<Math.min(.45,.06+state.job.jahreImJob*.024+state.stats.intelligenz*.0012)){state.job.stufe++;state.job.gehalt=Math.round(state.job.gehalt*1.14);apply({glueck:7});addLog(`Du wirst befördert. ${state.job.titel}, Stufe ${state.job.stufe}: ${eur(state.job.gehalt)} Jahresgehalt.`,'gross');}else if(Math.random()<.22){state.job.gehalt=Math.round(state.job.gehalt*1.04);addLog(`Eine Gehaltserhöhung. Du verdienst jetzt ${eur(state.job.gehalt)} im Jahr.`,'gut');}if(Math.random()<.014){addLog('Deine Stelle wird gestrichen. Du musst dich neu bewerben.','schlecht');state.job=null;apply({glueck:-10});}}if(state.job&&state.job.gehalt>state.records.gehalt){state.records.gehalt=state.job.gehalt;state.records.job=state.job.titel+' · Stufe '+state.job.stufe;}}
if(state.alter===67&&state.job)addLog('Du trittst kürzer. Statt Gehalt bekommst du im Spiel jetzt die halbe Summe als Rente.','gross');
if(state.alter>=18){let cost=['studium','ausbildung'].includes(state.bildung)?6200:9600;if(state.bildung==='studium')cost+=3000;if(hobbyLevel('kochen')>=30)cost=Math.round(cost*(1-hobbyLevel('kochen')*.0015));state.geld-=cost;state.finanzen.kosten=cost;}
if(state.geld<0){const interest=Math.round(Math.abs(state.geld)*.035);state.geld-=interest;state.finanzen.kosten+=interest;apply({glueck:-4});if(state.geld<-30000)apply({gesundheit:-2});}
for(const h of state.hobbys){const def=HOBBYS.find(d=>d.id===h.id);if(h.trainYear===state.jahr-1){h.jahre++;h.niveau=clamp(h.niveau+Math.max(4,Math.round(12-h.niveau*.08)));apply(def.wirkung);for(const threshold of [30,60,90])if(h.niveau>=threshold&&!h.meilensteine.includes(threshold)){h.meilensteine.push(threshold);addLog(`${h.name}: Niveau ${threshold}. ${threshold===30?'Aus Probieren wird Können.':threshold===60?'Dein Können wird auch anderen klar.':'Du gehörst zu den richtig Guten.'}`,'gross');apply({glueck:6,follower:state.kanal?threshold*20:0});if(threshold===30&&Math.random()<.5)addFriend();}if(h.niveau>=60&&state.alter>=16){let bonus=Math.round(def.preis*h.niveau/60);if(h.id==='gitarre'&&h.niveau>=90)bonus+=8000;state.geld+=bonus;state.finanzen.hobby+=bonus;addLog(`${h.name} bringt dir ${eur(bonus)} ${h.id==='code'?'mit einem kleinen Auftrag':h.id==='gitarre'?'durch einen Auftritt':'durch dein Können'} ein.`,'gut');}if(def.risiko&&Math.random()<def.risiko){apply({gesundheit:-8,glueck:-3});addLog(`Beim ${h.name} geht etwas schief. Du brauchst eine Pause.`,'schlecht');}}else h.niveau=clamp(h.niveau-3);if(h.niveau>state.records.niveau){state.records.niveau=h.niveau;state.records.hobby=h.name;}}

}
const PLATFORMS={tiktok:{name:'TikTok',growth:1.65,viral:1.2,rate:.035,churn:[.04,.08],paidChurn:[.21,.25],adCost:3400},instagram:{name:'Instagram',growth:1,viral:1,rate:.1,churn:[.02,.06],paidChurn:[.18,.23],adCost:4400},youtube:{name:'YouTube',growth:.7,viral:.82,rate:.22,churn:[0,.035],paidChurn:[.15,.2],adCost:6400}};
const NICHES={gaming:['Gaming','code'],sport:['Sport','bike'],musik:['Musik','gitarre'],comedy:['Comedy','zeichnen'],wissen:['Wissen','schach'],reisen:['Reisen','foto'],fitness:['Fitness','fussball']};
const RESULTS={flop:['Flop',.9],solide:['Solide',.65],stark:['Stark',.4],viral:['Viral',.15]};
const BUDGETS=[0,100,500,2000,10000];
function newChannel(name,niche,platform){return{name,nische:niche,plattformen:Object.fromEntries(Object.keys(PLATFORMS).map(k=>[k,{follower:0,gekauft:0,aktiv:k===platform,lastPost:-100}])),ruf:50,verifiziert:false,postsDiesesJahr:0,postsGesamt:0,einnahmenGesamt:0,letzteEinnahmen:0,werbungGesamt:0,postStreak:0,letztesPostJahr:-100,pauseBis:0,history:[]};}
function adShare(){const count=totalFollowers();return count?Object.values(state.kanal.plattformen).reduce((n,p)=>n+(p.aktiv?p.gekauft:0),0)/count:0;}
function postingAllowed(){return canAct(13)&&state.kanal&&state.jahr>=state.kanal.pauseBis;}
function annualCreator(){
const c=state.kanal;
if(c){let income=0;for(const [key,p]of Object.entries(c.plattformen)){if(!p.aktiv)continue;const def=PLATFORMS[key],posted=p.lastPost===state.jahr-1;let org=p.follower-p.gekauft;const od=def.churn[0]+Math.random()*(def.churn[1]-def.churn[0]);const pd=def.paidChurn[0]+Math.random()*(def.paidChurn[1]-def.paidChurn[0]);org=Math.round(org*(1-od));p.gekauft=Math.round(p.gekauft*(1-pd));if(posted)org+=Math.round(org*(key==='tiktok'?.04:.025));p.follower=Math.max(0,org+p.gekauft);if(state.alter>=18)income+=(org+p.gekauft*.25)*def.rate*(.5+c.ruf/100);}
c.letzteEinnahmen=Math.round(income);c.einnahmenGesamt+=c.letzteEinnahmen;state.finanzen.creator=c.letzteEinnahmen;state.geld+=c.letzteEinnahmen;if(c.letzteEinnahmen>0)addLog(`Deine Kanäle bringen dieses Jahr ${eur(c.letzteEinnahmen)} ein.`,'gut');
if(c.letztesPostJahr!==state.jahr-1)c.postStreak=0;c.postsDiesesJahr=0;
const organic=Object.values(c.plattformen).reduce((n,p)=>n+p.follower-p.gekauft,0);if(organic>=100000&&!c.verifiziert){c.verifiziert=true;addLog('100.000 echte Follower. Dein Kanal wird verifiziert.','gross');apply({glueck:10,ruf:8});}
state.records.kanal=Math.max(state.records.kanal,totalFollowers());state.records.einnahmen=Math.max(state.records.einnahmen,c.letzteEinnahmen);
if(c.postStreak>=4){apply({gesundheit:-16,glueck:-19});c.pauseBis=state.jahr+1;c.postStreak=0;addLog('Vier Jahre nur Content. Du bist ausgebrannt und pausierst dieses Jahr mit allen Uploads.','schlecht');}
if(state.flags.entschuldigung){apply({ruf:6});state.flags.entschuldigung--;}
if(state.flags.vollzeit&&c.letzteEinnahmen<state.finanzen.kosten)addLog('Dein Kanal deckt die Lebenshaltungskosten dieses Jahr nicht.','schlecht');
}
if(state.onlyfans&&state.alter>=18){const f=state.onlyfans;const active=f.lastPost===state.jahr-1;const churn=active?.07+.04*Math.random():.22+.08*Math.random();f.abos=Math.max(0,Math.round(f.abos*(1-churn)));if(!active)f.zufriedenheit=clamp(f.zufriedenheit-10);f.letzteEinnahmen=Math.round(f.abos*f.preis*12*.8*(.5+f.zufriedenheit/200));f.einnahmenGesamt+=f.letzteEinnahmen;state.geld+=f.letzteEinnahmen;state.finanzen.abo=f.letzteEinnahmen;f.postsDiesesJahr=0;if(f.letzteEinnahmen>0)addLog(`Dein nicht-erotisches OnlyFans-Abo bringt ${eur(f.letzteEinnahmen)} ein. ${num(f.abos)} Menschen bleiben dabei.`,'gut');}
}
function calculatePost(platform,kind,budget){const c=state.kanal,p=c.plattformen[platform],d=PLATFORMS[platform],skill=hobbyLevel(NICHES[c.nische][1]);const quality=.3+skill/180+state.stats.intelligenz/300+state.stats.aussehen/(platform==='instagram'?170:500)+c.ruf/200;let viralChance=(kind==='sicher'?0:kind==='trend'?.09:.16)+skill/900+c.ruf/1700+Math.min(.035,c.postsGesamt*.002);if(kind==='sicher')viralChance=0;viralChance*=d.viral;if(adShare()>.4)viralChance*=.35;const roll=Math.random();let result=kind==='sicher'?'solide':roll<viralChance?'viral':roll<(kind==='experiment'?.46:.25)?'flop':roll>.75?'stark':'solide';const base=(220+(p.follower-p.gekauft)*.06)*quality*d.growth;let organic=result==='flop'?Math.max(4,Math.round(base*.025)):result==='viral'?Math.round((9000+Math.sqrt(p.follower)*150+p.follower*1.8)*quality*d.growth):result==='stark'?Math.round(base*5):Math.round(base);if(state.flags.drosselBis>=state.jahr)organic=Math.round(organic*.5);const multiplier=1+Math.min(1.5,Math.sqrt(budget/d.adCost));const gain=Math.round(organic*multiplier);const bought=budget>0?Math.round(gain*RESULTS[result][1]):0;return{result,organic,gain,bought,multiplier,views:Math.round(organic*(result==='viral'?35:18)),quality};}
function uploadVideo(platform,kind,budget){if(!postingAllowed()||!PLATFORMS[platform]||!state.kanal.plattformen[platform].aktiv||!['sicher','trend','experiment'].includes(kind)||!BUDGETS.includes(budget)||budget>0&&state.geld<budget)return false;const c=state.kanal,p=c.plattformen[platform],r=calculatePost(platform,kind,budget);consume();state.geld-=budget;c.werbungGesamt+=budget;p.follower+=r.gain;p.gekauft+=r.bought;p.lastPost=state.jahr;c.postsDiesesJahr++;c.postsGesamt++;c.postStreak=c.letztesPostJahr===state.jahr-1?c.postStreak+1:1;c.letztesPostJahr=state.jahr;apply({ruf:r.result==='flop'?-4:r.result==='viral'?7:3,glueck:r.result==='flop'?-5:r.result==='viral'?12:4});addLog(`${PLATFORMS[platform].name} · ${RESULTS[r.result][0]}: ${num(r.views)} organische Aufrufe, +${num(r.gain)} Follower.${budget?' '+eur(budget)+' Werbung verstärkt um ×'+r.multiplier.toFixed(2).replace('.',',')+'.':''}`,r.result==='flop'?'schlecht':r.result==='viral'?'gross':'gut');if(r.result==='viral'){for(const [key,other]of Object.entries(c.plattformen))if(key!==platform&&other.aktiv){const cross=Math.round(r.organic*.1);other.follower+=cross;addLog(`Der Treffer bringt auch ${PLATFORMS[key].name} ${num(cross)} echte Follower.`,'gut');}state.flags.folge.push({jahr:state.jahr+1,text:'Dein virales Video taucht noch einmal auf. Eine neue Gruppe findet deinen Kanal.',wirkung:{follower:Math.round(r.organic*.07),glueck:3},art:'gut'});}c.history.unshift({jahr:state.jahr,platform,kind,result:r.result,gain:r.gain,views:r.views,budget});c.history=c.history.slice(0,12);state.records.kanal=Math.max(state.records.kanal,totalFollowers());return r;}
function loseFollowers(fraction){if(!state.kanal)return;for(const p of Object.values(state.kanal.plattformen)){p.follower=Math.round(p.follower*(1-fraction));p.gekauft=Math.min(p.follower,Math.round(p.gekauft*(1-fraction)));}}
function sponsorAmount(){if(!state.kanal)return 0;const ig=state.kanal.plattformen.instagram;const effective=Object.values(state.kanal.plattformen).reduce((n,p)=>n+(p.aktiv?p.follower-p.gekauft+p.gekauft*.25:0),0);return Math.round(1000+(effective+(ig.aktiv?ig.follower-ig.gekauft+ig.gekauft*.5:0))*.025);}

function extraPanel(view){
if(view==='aktivitaeten')return `<div class="section-head"><div><h2>Zeit für dich</h2><p>${state.flags.aktion?'Deine Aktivität für dieses Jahr ist aufgebraucht.':'Eine Aktivität. Was brauchst du gerade?'}</p></div><span class="pill">${state.flags.aktion?'0':'1'} / 1</span></div><div class="action-grid">${ACTIVITIES.map(a=>`<button class="action-card" data-action="activity" data-id="${a.id}" ${!canAct(a.min,a.kosten)?'disabled':''}><div class="row">${icon(a.icon)}<h3>${a.name}</h3></div><p>${Object.entries(a.wirkung).map(([k,v])=>`${STATS[k][0]} ${v>0?'+':''}${v}`).join(' · ')}${a.risiko?' · Risiko':''}</p><span class="price">${a.kosten?eur(a.kosten):'Kostenlos'}${state.alter<a.min?' · ab '+a.min+' Jahren':''}</span></button>`).join('')}</div>`;
if(view==='hobbys')return `<div class="section-head"><div><h2>Was dich antreibt</h2><p>Ein Hobby pro Jahr üben. Ohne Übung: −3 Niveau.</p></div></div><div class="panel-list">${HOBBYS.map(h=>{const own=state.hobbys.find(x=>x.id===h.id);return `<section class="list-item"><div class="row between"><div class="row grow">${icon(h.icon)}<h3>${h.name}</h3></div><span class="pill">${own?'Niveau '+own.niveau:'Neu'}</span></div><p>${Object.entries(h.wirkung).map(([k,v])=>`${STATS[k][0]} +${v}`).join(' · ')}${h.id==='kochen'?' · Spart Lebenshaltungskosten':''}${h.id==='code'?' · Öffnet IT-Berufe':''}${h.risiko?' · Verletzungsrisiko':''}</p>${own?`<div class="bar" aria-label="Niveau ${own.niveau}"><span style="transform:scaleX(${own.niveau/100})"></span></div><p style="margin-top:10px">${own.jahre} aktive Jahre · Meilensteine bei 30 / 60 / 90</p>`:''}${btn(own?.trainYear===state.jahr?'Dieses Jahr aktiv':own?'Dieses Jahr üben':'Hobby anfangen','hobby','plus',!canAct(6),`data-id="${h.id}"`)}</section>`;}).join('')}</div>`;
if(view==='karriere')return `<div class="section-head"><div><h2>Dein nächster Schritt</h2><p>${esc(BILDUNG[state.bildung])} · ${state.alter<18?'Bewerbungen ab 18 Jahren':'Ein Gehalt ist nicht alles. Aber es hilft.'}</p></div></div>${state.job?`<section class="card" style="margin-bottom:24px"><div class="eyebrow">Aktueller Beruf</div><h2>${esc(state.job.titel)}</h2><p class="muted">${eur(state.job.gehalt)} / Jahr · Stufe ${state.job.stufe} · ${state.job.jahreImJob} Jahre dabei</p><div style="margin-top:16px">${btn('Job kündigen','quit','',!available())}</div></section>`:''}${state.kanal&&state.kanal.letzteEinnahmen>=18000&&!state.flags.vollzeit?`<div class="notice"><p>Dein Kanal kann dich tragen – solange die Einnahmen halten.</p>${btn('Hauptberuf Creator','fulltime','video',!available())}</div>`:''}<div class="panel-list">${JOBS.map(j=>`<section class="list-item"><div class="row between"><h3 class="grow">${j.titel}</h3><span class="small accent">${eur(j.gehalt)}</span></div><p>${j.branche} · ${jobRequirement(j)}</p>${btn('Bewerben','job','arrow',!available()||!jobEligible(j)||state.job?.id===j.id,`data-id="${j.id}"`)}</section>`).join('')}</div>`;
if(view==='beziehungen')return `<div class="section-head"><div><h2>Deine Menschen</h2><p>Nähe entsteht durch Zeit. Und braucht sie auch.</p></div></div><div class="panel-list">${state.beziehungen.length?state.beziehungen.map(b=>`<section class="list-item"><div class="row between"><div class="row grow"><div class="monogram" style="width:40px;height:40px;font-size:.9rem">${esc(b.name[0])}</div><div><h3>${esc(b.name)}</h3><span class="small muted">${esc(b.typ)}</span></div></div><span class="small">${b.verhaeltnis}%</span></div><div class="bar"><span style="transform:scaleX(${b.verhaeltnis/100})"></span></div><div style="margin-top:16px">${btn('Zeit verbringen','relationship','users',!canAct(3),`data-id="${esc(b.id)}"`)}</div></section>`).join(''):'<div class="empty"><p>Über Hobbys, Schule, Arbeit oder eine Party lernst du neue Menschen kennen.</p></div>'}</div>`;
return creatorPanel(view);
}
function creatorPanel(view){
if(view==='onlyfans')return onlyfansPanel();
const c=state.kanal;if(!c)return `<div class="section-head"><h2>Deine Stimme. Deine Community.</h2></div><div class="empty">${icon('video')}<h3>Jeder Kanal fängt bei null an.</h3><p>Gaming, Musik oder dein ganz eigenes Ding. TikTok, Instagram und YouTube spielen nach unterschiedlichen Regeln.</p>${btn(state.alter<13?'Verfügbar ab 13 Jahren':'Kanal starten','channel-new','plus',state.alter<13||!state.lebendig,'',true)}</div><div class="notice">Direkte Einnahmen und Sponsoring gibt es im Spiel ab 18. Follower sind noch kein Einkommen.</div>`;
return `<div class="section-head"><div><h2>${esc(c.name)} ${c.verifiziert?icon('check'):''}</h2><p>${NICHES[c.nische][0]} · ${c.postsGesamt} Videos · ${c.verifiziert?'Verifiziert':'Dein Kanal'}</p></div>${btn('Video posten','post','plus',!postingAllowed(),' ',true)}</div><div class="metric-row"><div class="metric"><strong>${num(totalFollowers())}</strong><span>Follower gesamt</span></div><div class="metric"><strong>${c.ruf}%</strong><span>Ruf</span></div><div class="metric"><strong>${eur(c.letzteEinnahmen)}</strong><span>Einnahmen / Jahr</span></div></div>${adShare()>.1?`<div class="notice">Ad-Anteil: ${Math.round(adShare()*100)} %. Gekaufte Reichweite zählt nur zu 25 % für direkte Einnahmen; ab 40 % sinkt die Viral-Chance.</div>`:''}${state.jahr<c.pauseBis?'<div class="notice">Burnout-Pause: In diesem Jahr sind keine Uploads möglich. Nimm dir Zeit für etwas anderes.</div>':''}<div class="panel-list">${Object.entries(PLATFORMS).map(([key,d])=>{const p=c.plattformen[key];return `<section class="list-item"><div class="row between"><div class="row">${icon('video')}<h3>${d.name}</h3></div><span class="pill">${p.aktiv?'Aktiv':'Nicht aktiv'}</span></div><p>${key==='tiktok'?'Schnelle Reichweite. Flüchtige Aufmerksamkeit.':key==='instagram'?'Dein Auftritt zählt. Gute Chancen auf Sponsoring.':'Langsamer Start. Treue Fans und höhere Einnahmen.'}</p>${p.aktiv?`<div class="row between"><strong style="font-size:1.5rem;font-weight:500">${num(p.follower)}</strong><span class="small muted">${num(p.follower-p.gekauft)} organisch</span></div>`:btn('Plattform aktivieren','platform','plus',false,`data-id="${key}"`)}</section>`;}).join('')}</div><div class="section-head" style="margin-top:28px"><h3>Letzte Videos</h3><span class="small muted">${eur(c.werbungGesamt)} Werbung gesamt</span></div><div class="panel-list">${c.history.length?c.history.map(p=>`<div class="list-item"><div class="row between"><span>${PLATFORMS[p.platform].name} · ${p.jahr}</span><span class="pill">${RESULTS[p.result][0]}</span></div><p style="margin-bottom:0">+${num(p.gain)} Follower · ${num(p.views)} organische Aufrufe · ${eur(p.budget)} Werbung</p></div>`).join(''):'<p class="muted">Noch kein Video. Dein erster Post wartet.</p>'}</div>`;
}
function onlyfansPanel(){const f=state.onlyfans;if(state.alter<18)return `<div class="section-head"><div><h2>OnlyFans</h2><p>Creator-Abos · ab 18 Jahren im Spiel</p></div><span class="pill">18+</span></div><div class="empty">${icon('lock')}<h3>Ein späteres Kapitel.</h3><p>Ab 18 kann deine Spielfigur nicht-erotische Musik-, Fitness-, Kreativ- oder Behind-the-Scenes-Videos als Abo anbieten.</p><span class="pill">Noch ${18-state.alter} Spieljahre</span></div><p class="rail-note" style="margin-top:16px">Keine echten Accounts, Uploads oder Zahlungen. Alle Plattformen sind ausschließlich simuliert.</p>`;
if(!f)return `<div class="section-head"><div><h2>OnlyFans</h2><p>Nicht-erotische Creator-Abos</p></div><span class="pill">18+</span></div><div class="empty">${icon('lock')}<h3>Deine Inhalte. Für deine Fans.</h3><p>Poste exklusive Tutorials, Musik oder Einblicke hinter die Kulissen. Mit Vorschauclips auf TikTok und Instagram gewinnst du im Spiel neue Abos.</p>${btn('Creator-Abo starten','of-new','plus',!state.lebendig,'',true)}</div><div class="notice">Reine Spielsimulation: keine Erotik, keine echten Uploads, keine Verbindung zu den Plattformen. Preise und Einnahmen sind erfundene Spielwerte.</div>`;
return `<div class="section-head"><div><h2>OnlyFans</h2><p>${esc(f.name)} · ${esc(f.thema)}</p></div><span class="pill">Creator-Abo · 18+</span></div><div class="metric-row"><div class="metric"><strong>${num(f.abos)}</strong><span>Aktive Abos</span></div><div class="metric"><strong>${f.zufriedenheit}%</strong><span>Zufriedenheit</span></div><div class="metric"><strong>${eur(f.letzteEinnahmen)}</strong><span>Einnahmen / Jahr</span></div></div><section class="card"><div class="row between"><div><div class="eyebrow">Dein Abo</div><h2>${eur(f.preis)} <span class="small muted">/ Monat</span></h2></div>${btn('Preis ändern','of-price','',f.preisJahr===state.jahr)}</div><p class="small muted" style="margin:16px 0">${f.postsGesamt} exklusive Videos · ${eur(f.einnahmenGesamt)} bisher verdient</p>${btn('Exklusives Video posten','of-post','video',!ofPostingAllowed(),'',true)}</section>${state.jahr<f.pauseBis?'<div class="notice">Dieses Jahr ist eine Upload-Pause nötig. Du kannst wieder posten, sobald das nächste Jahr beginnt.</div>':''}<section class="list-item" style="margin-top:16px"><div class="row">${icon('chart')}<h3>Neue Fans erreichen</h3></div><p>Du kannst jeden exklusiven Upload mit einem nicht-erotischen Vorschauclip auf TikTok, Instagram oder beiden Kanälen bewerben. Das gehört zur selben Jahresaktivität.</p>${!state.kanal?btn('Öffentlichen Kanal starten','channel-new','plus'):''}<p style="margin-bottom:0">Ohne neue Inhalte kündigen mehr Abonnenten. Höhere Preise erschweren den Einstieg.</p></section><div class="notice">Nur Musik, Fitness, Tutorials und Behind-the-Scenes. Keine realen Posts oder Zahlungen; alle Werte sind Spielannahmen.</div><h3 style="margin:24px 0 16px">Deine exklusiven Videos</h3><div class="panel-list">${f.history.length?f.history.map(v=>`<div class="list-item"><div class="row between"><h3>${esc(v.title)}</h3><span class="small muted">${v.jahr}</span></div><p>${esc(v.promo)} · +${num(v.abos)} Abos · ${eur(v.budget)} Werbung</p></div>`).join(''):'<p class="muted">Noch kein Video veröffentlicht.</p>'}</div>`;
}
function render(){if(!state.ui.started)return renderStart();const prev=Object.fromEntries([...document.querySelectorAll('.stat-grid .bar>span')].map((e,i)=>[i,e.style.transform]));const focused=document.activeElement?.dataset?.action;document.getElementById('app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand">${icon('line')}Lebenslinie<span class="period">.</span></div><nav class="nav" aria-label="Spielbereiche">${Object.entries(VIEWS).map(([k,[t,i]])=>`<button class="${state.ui.view===k?'active':''}" data-action="view" data-id="${k}" ${state.ui.view===k?'aria-current="page"':''}>${icon(i)}${t}${(k==='creator'&&state.alter<13)||(k==='onlyfans'&&state.alter<18)?`<span class="lock">${k==='creator'?'13+':'18+'}</span>`:''}</button>`).join('')}</nav><div class="side-bottom">${btn('Speichern & laden','save','save')}${btn('Neues Leben','new','plus')}<div class="side-foot">Dein Spielstand bleibt in dieser Sitzung.<br>Vor dem Schließen speichern.</div></div></aside><main class="main"><header class="topbar"><div class="breadcrumb">Lebenslinie <span>/</span><span>${VIEWS[state.ui.view][0]}</span></div><div class="brand mobile-brand">${icon('line')}Lebenslinie.</div><div class="topbar-right"><span class="pill">${icon('clock')}Jahr ${state.jahr}</span><button class="icon-button" data-action="save" aria-label="Speichern und laden">${icon('save')}</button><button class="icon-button" data-action="new" aria-label="Neues Leben">${icon('plus')}</button></div></header><section class="identity"><div class="monogram" aria-hidden="true">${esc(state.name.split(' ').filter(Boolean).slice(0,2).map(n=>n[0]).join(''))}</div><div class="grow"><h1>${esc(state.name)}</h1><div class="subline"><span>${esc(state.stadt)}</span><span>·</span><span>${esc(state.job?.titel||BILDUNG[state.bildung])}</span></div></div><div class="age-block"><div class="age-number">${state.alter.toString().padStart(2,'0')}</div><small>Jahre alt</small></div></section>${statsHTML()}<div class="body-grid"><section class="grow" id="panel">${renderPanel()}</section>${railHTML()}</div><footer class="year-footer"><span class="hint">${state.lebendig?(state.flags.aktion?'Deine Aktivität ist aufgebraucht.':'Eine Aktivität verfügbar.'):'Jedes Ende ist auch ein Anfang.'}</span>${state.lebendig?btn('Jahr weiter','year','plus',!!state.flags.pend.length,'',true):btn('Neues Leben','new','plus',false,'',true)}</footer></main></div>`;const bars=[...document.querySelectorAll('.stat-grid .bar>span')];for(let i=0;i<bars.length;i++){const to=bars[i].style.transform;if(prev[i]){bars[i].style.transform=prev[i];requestAnimationFrame(()=>{bars[i].style.transform=to;});}}const tl=document.getElementById('timeline');if(tl)tl.scrollTop=tl.scrollHeight;state.flags.rendered=state.log.length;if(focused==='year')document.querySelector('[data-action="year"]')?.focus({preventScroll:true});}
function openDialog(type,data){const d=document.getElementById('dialog');state.ui.modal=type;let title='',body='';if(type==='entscheidung'){title='Eine Entscheidung';body=`<p>${esc(typeof data.text==='function'?data.text(state):data.text)}</p><div class="choice-list">${data.optionen.map((o,i)=>btn(esc(o.text),'choice','',o.bedingung&&!o.bedingung(state)||o.kosten>state.geld,`data-id="${i}"`)).join('')}</div>`;}else if(type==='new'){title='Ein neues Leben beginnen?';body=`<p>Dein aktuelles Leben wird ersetzt. Kopiere vorher deinen Spielstand, wenn du es behalten möchtest.</p><div class="dialog-actions">${btn('Abbrechen','close','')}${btn('Neu beginnen','reset','plus',false,'',true)}</div>`;}else if(type==='save'||type==='load'){title=type==='save'?'Dein Leben aufbewahren':'Speicherstand laden';body=`<p>Kopiere deinen Spielstand als Text. Zum Fortsetzen fügst du ihn hier wieder ein. Es wird nichts automatisch gespeichert.</p>${type==='save'?btn('Speicherstand kopieren','copy','save') :''}<div class="field" style="margin-top:20px"><label for="save-data">Spielstand als JSON</label><textarea id="save-data" spellcheck="false" placeholder="Spielstand hier einfügen …">${type==='save'?esc(JSON.stringify(state)):''}</textarea></div><p class="form-error" id="load-error" role="alert"></p>${btn('Diesen Spielstand laden','import','upload',false,'',true)}`;}else{const out=extraDialog(type,data);if(!out)return;title=out.title;body=out.body;}d.innerHTML=`<div class="dialog-head"><h2 id="dialog-title">${title}</h2>${type==='entscheidung'?'':`<button class="icon-button" data-action="close" aria-label="Schließen">${icon('close')}</button>`}</div><div class="dialog-body">${body}</div>`;if(!d.open)d.showModal();}
function extraDialog(type){if(type==='procedure')return{title:'Ein Eingriff ist eine Entscheidung',body:`<p>4.500 € für meist +16 Aussehen. Im Spiel besteht ein Risiko von 15 % für −12 Aussehen und −10 Glück.</p><div class="dialog-actions">${btn('Abbrechen','close','')}${btn('Eingriff durchführen','procedure-confirm','',!canAct(18,4500))}</div>`};if(type==='quit')return{title:'Deinen Job kündigen?',body:`<p>Du gibst dein regelmäßiges Einkommen auf. Die Kündigung verbraucht deine Jahresaktivität.</p>${btn('Kündigung bestätigen','quit-confirm','')}`};if(type==='fulltime')return{title:'Alles auf deinen Kanal setzen?',body:`<p>Du kündigst deinen Job. Deine Creator-Einnahmen schwanken, die Lebenshaltungskosten bleiben.</p>${btn('Hauptberuf Creator werden','fulltime-confirm','video')}`};return creatorDialog(type);}
function budgetHTML(prefix='budget'){return `<fieldset class="field" style="border:0;padding:0"><legend>Werbebudget</legend><div class="choice-price">${BUDGETS.map((b,i)=>`<label><input type="radio" name="${prefix}" value="${b}" ${i===0?'checked':''} ${b>0&&state.geld<b?'disabled':''}>${eur(b)}</label>`).join('')}</div></fieldset><p class="small muted" style="margin-bottom:20px">Werbung verstärkt nur, was ohnehin funktioniert.</p>`;}
function creatorDialog(type){const c=state.kanal,f=state.onlyfans;
if(type==='channel-new')return{title:'Dein Kanal beginnt hier',body:`<form id="channel-form"><div class="field"><label for="channel-name">Kanalname</label><input id="channel-name" value="${esc(state.name.split(' ')[0])}s Kanal" maxlength="40" required></div><div class="field-pair"><div class="field"><label for="channel-niche">Deine Nische</label><select id="channel-niche">${Object.entries(NICHES).map(([k,[label]])=>`<option value="${k}">${label}</option>`).join('')}</select></div><div class="field"><label for="channel-platform">Erste Plattform</label><select id="channel-platform">${Object.entries(PLATFORMS).map(([k,d])=>`<option value="${k}">${d.name}</option>`).join('')}</select></div></div><p class="small muted" style="margin-bottom:20px">Einrichten kostet keine Jahresaktivität. Dein erster Upload schon.</p><button class="btn primary full" type="submit">Kanal starten ${icon('arrow')}</button></form>`};
if(type==='post'&&c)return{title:'Ein neues Video',body:`<form id="post-form"><div class="field"><label for="post-platform">Plattform</label><select id="post-platform">${Object.entries(PLATFORMS).filter(([k])=>c.plattformen[k].aktiv).map(([k,d])=>`<option value="${k}">${d.name}</option>`).join('')}</select></div><div class="field"><label for="post-kind">Art des Videos</label><select id="post-kind"><option value="sicher">Sicher · verlässliches, kleines Wachstum</option><option value="trend">Trend · Chance auf einen Ausreißer</option><option value="experiment">Experiment · mehr Risiko, mehr Potenzial</option></select></div>${budgetHTML()}<button class="btn primary full" type="submit">Video veröffentlichen ${icon('arrow')}</button><p class="small muted" style="margin-top:12px">Verbraucht deine Aktivität für ${state.jahr}.</p></form>`};
if(type==='of-new')return{title:'Dein nicht-erotisches Creator-Abo',body:`<form id="of-new-form"><div class="field"><label for="of-name">Name des Abo-Kanals</label><input id="of-name" value="${esc(state.name.split(' ')[0])} – exklusiv" maxlength="40" required></div><div class="field"><label for="of-theme">Deine Inhalte</label><select id="of-theme"><option>Behind-the-Scenes</option><option>Musik & Sessions</option><option>Fitness & Training</option><option>Kunst & Tutorials</option><option>Kochen & Rezepte</option></select></div><div class="field"><label for="of-price">Monatspreis · Spielwert</label><select id="of-price">${[5,9,15,25].map(n=>`<option value="${n}" ${n===9?'selected':''}>${eur(n)} / Monat</option>`).join('')}</select></div><p class="small muted" style="margin-bottom:20px">Nur für erwachsene Spielfiguren. Kein Content für Erwachsene und keine echten Accounts.</p><button class="btn primary full" type="submit">Abo-Kanal starten ${icon('arrow')}</button></form>`};
if(type==='of-post'&&f)return{title:'Exklusives Video veröffentlichen',body:`<form id="of-post-form"><div class="field"><label for="of-video">Inhalt des Videos</label><select id="of-video"><option>Ein Blick hinter die Kulissen</option><option>Mein ausführliches Tutorial</option><option>Eine exklusive Musik-Session</option><option>Meine Trainingsroutine</option><option>Mein Kreativ-Workshop</option><option>Mein neues Rezept</option></select></div><div class="field"><label for="of-promo">Vorschauclip zur Werbung</label><select id="of-promo"><option value="none">Keine Cross-Promo</option><option value="tiktok" ${!c?.plattformen.tiktok.aktiv?'disabled':''}>Auf TikTok werben</option><option value="instagram" ${!c?.plattformen.instagram.aktiv?'disabled':''}>Auf Instagram werben</option><option value="both" ${!(c?.plattformen.tiktok.aktiv&&c?.plattformen.instagram.aktiv)?'disabled':''}>Auf TikTok und Instagram werben</option></select></div>${budgetHTML('of-budget')}<p class="small muted" style="margin-bottom:20px">Bezahlte Werbung ist nur mit einem aktiven Vorschaukanal möglich. Upload und Vorschauclip zählen zusammen als eine Aktivität.</p><p id="of-error" class="form-error" role="alert"></p><button class="btn primary full" type="submit">Video posten ${icon('arrow')}</button></form>`};
if(type==='of-price'&&f)return{title:'Deinen Abo-Preis ändern',body:`<form id="of-price-form"><div class="field"><label for="of-price-change">Neuer Monatspreis</label><select id="of-price-change">${[5,9,15,25].map(n=>`<option value="${n}" ${n===f.preis?'selected':''}>${eur(n)}</option>`).join('')}</select></div><p class="small muted" style="margin-bottom:20px">Bei einer Erhöhung kündigen 15 % deiner Abonnenten sofort. Einmal pro Spieljahr möglich.</p><button class="btn primary" type="submit">Preis speichern</button></form>`};
return null;
}
function closeDialog(force=false){if(state.ui.modal==='entscheidung'&&!force)return;document.getElementById('dialog').close();state.ui.modal=null;}
function totalFollowers(){return state.kanal?Object.values(state.kanal.plattformen).reduce((n,p)=>n+(p.aktiv?p.follower:0),0):0;}
function extraAction(a,id){
if(a==='activity'){const d=ACTIVITIES.find(x=>x.id===id);if(!d||!canAct(d.min,d.kosten))return;if(d.risiko){openDialog('procedure');return;}consume();apply({geld:-d.kosten,...d.wirkung});addLog(d.text,'gut');if(id==='party'&&Math.random()<.4)addFriend();state.ui.view='leben';render();}
else if(a==='procedure-confirm'){const d=ACTIVITIES.find(x=>x.id==='eingriff');if(!canAct(18,d.kosten))return;consume();apply({geld:-d.kosten});if(Math.random()<d.risiko){apply({aussehen:-12,glueck:-10});addLog('Der kosmetische Eingriff geht nicht wie erhofft aus. Du bereust die Entscheidung.','schlecht');}else{apply(d.wirkung);addLog(d.text,'gut');}closeDialog();render();}
